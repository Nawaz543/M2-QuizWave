<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <title>M2 QuizWave</title>

  <link
    rel="stylesheet"
    href="./titlebar.css"
  />

</head>


<body>

  <!-- ==========================
       NORMAL TITLE BAR
  =========================== -->

  <div id="titlebar">

    <div class="drag-area"></div>

    <div class="title">
      M2 QuizWave
    </div>


    <div class="controls">

      <button
        id="minimizeBtn"
        class="control-btn"
        type="button"
      >
        −
      </button>


      <button
        id="closeBtn"
        class="control-btn close-btn"
        type="button"
      >
        ×
      </button>

    </div>

  </div>


 <!-- ==========================
     MINI MODE
=========================== -->

<div id="miniContainer">

  <div id="miniLogo">

    <img
      src="./logo.png"
      alt="M2 QuizWave"
    />

  </div>


  <div id="restore">
    Mission 2
  </div>

</div>


  <script src="./titlebar.js"></script>

</body>

</html>
